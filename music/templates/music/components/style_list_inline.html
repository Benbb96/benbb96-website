{% load i18n %}
{% if styles %}
    {% if not header_inline %}
        <h3>{% trans "Styles" %}</h3>
    {% endif %}
    <ul class="ds-inline-list">
        {% if header_inline %}<li>{% trans "Styles" %} :</li>{% endif %}
        {% for style in styles.all %}
            <li>
                <a class="ds-badge" href="{{ style.get_absolute_url }}">{{ style }}</a>
            </li>
        {% endfor %}
    </ul>
{% endif %}
