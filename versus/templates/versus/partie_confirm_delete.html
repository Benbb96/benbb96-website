{% extends 'versus/base_jeu.html' %}

{% block versus_title %}Suppression partie de {{ jeu }}{% endblock %}

{% block jeu_content %}
    <div class="ds-well ds-text-center">
        <h2>Suppression partie</h2>
        <form method="post">
            {% csrf_token %}
            <p>Êtest-vous sûr de vouloir supprimer la partie de {{ jeu }} du {{ partie.date }} ?</p>
            <div class="ds-cluster ds-cluster--center">
                <button type="submit" class="ds-btn ds-btn--danger">Oui, je suis sûr</button>
                <a class="ds-btn ds-btn--ghost" href="{{ jeu.get_absolute_url }}">Annuler</a>
            </div>
        </form>
    </div>
{% endblock %}
