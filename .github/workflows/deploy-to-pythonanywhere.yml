name: Deploy to PythonAnywhere
on:
  push:
    branches:
      - main
jobs:
  Deploy-Through-SSH:
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - name: Connect via SSH and Deploy new version
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd "$HOME/benbb96-website"
            git pull
            # Dépendances gérées par uv (pyproject.toml + uv.lock).
            # On installe DANS le venv existant du Web tab de PA (non modifié).
            export UV_PROJECT_ENVIRONMENT="$HOME/.virtualenvs/benbb96"
            export UV_PYTHON_PREFERENCE=only-system   # réutilise le Python 3.13 de PA, pas de download
            "$HOME/.local/bin/uv" sync --frozen --no-dev   # installe exactement uv.lock, sans deps dev
            "$UV_PROJECT_ENVIRONMENT/bin/python" manage.py migrate
            "$UV_PROJECT_ENVIRONMENT/bin/python" manage.py collectstatic --noinput
            touch /var/www/www_benbb96_com_wsgi.py
