version: 2
updates:
  # Dépendances Python — gérées par uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Regroupe les bumps mineurs/patch en une seule PR hebdo (moins de bruit)
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions GitHub utilisées par les workflows (deploy, codeql)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
