<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #1c1912; text-decoration: none; } a:hover { color: #caa100; }
    .cs {
      --ds-bg:#f7f5ef; --ds-surface:#ffffff; --ds-surface-alt:#efece1;
      --ds-text:#1c1912; --ds-text-muted:#5c5646;
      --ds-border:#e3ddc9; --ds-border-strong:#cabf9e;
      --ds-primary:#f2c200; --ds-primary-dark:#caa100; --ds-primary-light:#fdf1c7; --ds-primary-ink:#201a08;
      --ds-secondary:#1c1912;
      --ds-success:#3f7d4a; --ds-warning:#d9660b; --ds-danger:#c1432c; --ds-info:#2f6f8f;
    }
    .cs.theme-dark {
      --ds-bg:#15130e; --ds-surface:#1d1a13; --ds-surface-alt:#262218;
      --ds-text:#f3efe3; --ds-text-muted:#b5ad97;
      --ds-border:#35301f; --ds-border-strong:#4a4328;
      --ds-primary:#e0ab2c; --ds-primary-dark:#f0c04a; --ds-primary-light:#332a12; --ds-primary-ink:#17130a;
      --ds-secondary:#0f0d09;
      --ds-success:#63a86f; --ds-warning:#e2883f; --ds-danger:#e0715a; --ds-info:#5da0c4;
    }
  </style>
</helmet>
<div class="cs {{themeClass}}" style="min-height: 880px; display: flex; flex-direction: column; background: var(--ds-bg); color: var(--ds-text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 17px; line-height: 1.6;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--ds-secondary); color: #f3efe3;">
    <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; margin-left: -8px; cursor: pointer;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width: 20px; height: 20px;"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <div style="font-size: 17px; font-weight: 600; line-height: 1.3;">Couches taille 4</div>
      <div style="font-size: 13px; color: #b5ad97; line-height: 1.3;">Bébé · paquet de 40</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 16px; flex-grow: 1;">

    <div style="border: 1px solid var(--ds-border); border-radius: 12px; background: var(--ds-surface); padding: 14px 14px 10px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-text-muted);">Stock estimé</div>
      <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 2px;">
        <div style="font-size: 38px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums;">6</div>
        <div style="font-size: 17px; color: var(--ds-text-muted);">couches</div>
        <div style="flex-grow: 1;"></div>
        <div style="padding: 0.15em 0.6em; font-size: 15px; font-weight: 600; line-height: 1.4; border-radius: 999px; background: color-mix(in srgb, var(--ds-warning) 16%, var(--ds-surface)); color: var(--ds-text); white-space: nowrap;">Épuisé le 28 août</div>
      </div>

      <svg viewBox="0 0 358 162" style="width: 100%; height: auto; display: block; margin-top: 10px; overflow: visible;">
        <line x1="26" y1="140" x2="350" y2="140" stroke="var(--ds-border)" stroke-width="1"/>
        <line x1="26" y1="81.33" x2="350" y2="81.33" stroke="var(--ds-border)" stroke-width="1"/>
        <line x1="26" y1="22.67" x2="350" y2="22.67" stroke="var(--ds-border-strong)" stroke-width="1" stroke-dasharray="3 3"/>

        <text x="20" y="144" text-anchor="end" font-size="10" fill="var(--ds-text-muted)" font-family="system-ui, sans-serif">0</text>
        <text x="20" y="85" text-anchor="end" font-size="10" fill="var(--ds-text-muted)" font-family="system-ui, sans-serif">20</text>
        <text x="20" y="26" text-anchor="end" font-size="10" fill="var(--ds-text-muted)" font-family="system-ui, sans-serif">40</text>
        <text x="350" y="18" text-anchor="end" font-size="10" fill="var(--ds-text-muted)" font-family="system-ui, sans-serif">souhaité</text>

        <path d="M 26 140 L 26 22.67 L 186 140 L 190 22.67 L 258 81.33 L 258 72.53 L 326 122.4 L 326 140 Z"
              fill="color-mix(in srgb, var(--ds-info) 13%, transparent)"/>
        <path d="M 26 140 L 26 22.67 L 186 140 L 190 22.67 L 258 81.33 L 258 72.53 L 326 122.4"
              fill="none" stroke="var(--ds-info)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 326 122.4 L 350 140" fill="none" stroke="var(--ds-info)" stroke-width="2"
              stroke-dasharray="4 3" stroke-linecap="round" opacity="0.75"/>

        <line x1="326" y1="8" x2="326" y2="140" stroke="var(--ds-border-strong)" stroke-width="1" stroke-dasharray="2 3"/>

        <circle cx="26" cy="22.67" r="4" fill="var(--ds-info)" stroke="var(--ds-surface)" stroke-width="2"/>
        <circle cx="190" cy="22.67" r="4" fill="var(--ds-info)" stroke="var(--ds-surface)" stroke-width="2"/>
        <circle cx="258" cy="72.53" r="4" fill="var(--ds-surface)" stroke="var(--ds-info)" stroke-width="2"/>
        <circle cx="326" cy="122.4" r="5" fill="var(--ds-info)" stroke="var(--ds-surface)" stroke-width="2"/>

        <text x="316" y="115" text-anchor="end" font-size="12" font-weight="700" fill="var(--ds-text)" font-family="system-ui, sans-serif">6</text>

        <text x="26" y="156" text-anchor="start" font-size="10" fill="var(--ds-text-muted)" font-family="system-ui, sans-serif">8 juin</text>
        <text x="190" y="156" text-anchor="middle" font-size="10" fill="var(--ds-text-muted)" font-family="system-ui, sans-serif">19 juil.</text>
        <text x="330" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ds-text)" font-family="system-ui, sans-serif">auj.</text>
      </svg>

      <div style="display: flex; align-items: center; gap: 14px; margin-top: 6px; padding-top: 9px; border-top: 1px solid var(--ds-border); flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 5px;">
          <svg viewBox="0 0 20 8" style="width: 20px; height: 8px; flex: none;"><path d="M1 4h18" stroke="#2f6f8f" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" opacity="0.75"/></svg>
          <div style="font-size: 13px; color: var(--ds-text-muted);">Projection</div>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
          <svg viewBox="0 0 12 12" style="width: 11px; height: 11px; flex: none;"><circle cx="6" cy="6" r="4" fill="none" stroke="#2f6f8f" stroke-width="2"/></svg>
          <div style="font-size: 13px; color: var(--ds-text-muted);">Recomptage</div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--ds-border); border-radius: 12px; background: var(--ds-surface);">
      <div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1;">1,05</div>
      <div style="font-size: 15px; color: var(--ds-text-muted); flex-grow: 1; line-height: 1.35;">couche / jour, calculé sur les 3 derniers cycles d'achat</div>
    </div>

    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-text-muted); padding: 4px 2px 0;">Mouvements</div>

    <div style="border: 1px solid var(--ds-border); border-radius: 12px; background: var(--ds-surface); overflow: hidden;">
      <sc-for list="{{mouvements}}" as="m" hint-placeholder-count="4">
        <div style="{{m.blocStyle}}">
          <div style="display: flex; align-items: center; gap: 11px; padding: 10px 13px; min-height: 46px;">
            <div style="width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: {{m.pastille}};">
              <sc-if value="{{m.estAchat}}" hint-placeholder-val="{{true}}">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--ds-success)" stroke-width="2.2" stroke-linecap="round" style="width: 15px; height: 15px;"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </sc-if>
              <sc-if value="{{m.estRecalage}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--ds-info)" stroke-width="2.2" stroke-linecap="round" style="width: 15px; height: 15px;"><path d="M5 9h14M5 15h14"/></svg>
              </sc-if>
              <sc-if value="{{m.estPerte}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--ds-danger)" stroke-width="2.2" stroke-linecap="round" style="width: 15px; height: 15px;"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; flex-grow: 1;">
              <div style="font-size: 17px; font-weight: 600; line-height: 1.35;">{{m.libelle}}</div>
              <div style="font-size: 15px; color: var(--ds-text-muted); line-height: 1.35;">{{m.detail}}</div>
            </div>
            <div style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{m.deltaCouleur}}; white-space: nowrap; flex: none;">{{m.delta}}</div>
          </div>
        </div>
      </sc-for>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair","section":"Thème"}}'>
class Component extends DCLogic {
  renderVals() {
    const base = [
      { type: 'recalage', libelle: 'Recomptage', detail: '5 août · par Ben · l’estimation disait 20', delta: '= 23' },
      { type: 'achat', libelle: 'Achat', detail: '19 juillet · Leclerc Lescar · 1 paquet', delta: '+ 40' },
      { type: 'achat', libelle: 'Achat', detail: '8 juin · Drive Intermarché · 1 paquet', delta: '+ 40' },
      { type: 'perte', libelle: 'Perte', detail: '2 juin · paquet éventré dans le coffre', delta: '− 3' },
    ];
    const couleurs = { achat: 'var(--ds-success)', recalage: 'var(--ds-info)', perte: 'var(--ds-danger)' };
    const pastilles = {
      achat: 'color-mix(in srgb, var(--ds-success) 14%, var(--ds-surface))',
      recalage: 'color-mix(in srgb, var(--ds-info) 14%, var(--ds-surface))',
      perte: 'color-mix(in srgb, var(--ds-danger) 14%, var(--ds-surface))',
    };
    const mouvements = base.map((m, i) => ({
      libelle: m.libelle,
      detail: m.detail,
      delta: m.delta,
      deltaCouleur: couleurs[m.type],
      pastille: pastilles[m.type],
      estAchat: m.type === 'achat',
      estRecalage: m.type === 'recalage',
      estPerte: m.type === 'perte',
      blocStyle: i < base.length - 1 ? 'border-bottom: 1px solid var(--ds-border);' : '',
    }));
    return { themeClass: this.props.theme === 'sombre' ? 'theme-dark' : '', mouvements: mouvements };
  }
}
</script>
</body>
</html>
