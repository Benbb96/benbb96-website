[project]
name = "benbb96-website"
version = "0.1.0"
description = "Site web personnel de Benbb96 (Django)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django==5.2.14",
    "django-admin-sortable",  # fork LEAGUEDORA — voir [tool.uv.sources]
    "django-anymail==13.0",
    "django-autoslug==1.9.9",
    "django-colorfield==0.14.0",
    "django-cors-headers==4.7.0",
    "django-filter==25.1",
    "django-fontawesome-6==1.0.0.0",
    "django-geoposition-2==0.4.0",
    "django-pandas==0.6.7",
    "django-simple-history==3.8.0",
    "djangorestframework==3.16.0",
    "djangorestframework-simplejwt==5.5.1",
    "google-api-python-client==2.197.0",
    "pandas==2.2.3",
    "Pillow==12.2.0",
    "django-storages[google]==1.14.6",
    "python-slugify==8.0.0",
    "redis==4.5.4",  # requis par spotipy (cache_handler importe redis au chargement du module)
    "requests==2.33.0",
    "setuptools==80.9.0",
    "soundcloud",  # fork Benbb96 — voir [tool.uv.sources]
    "spotipy==2.25.2",
]

# Dépendances de développement (PEP 735). Exclues en prod via `uv sync --no-dev`.
[dependency-groups]
dev = [
    "django-debug-toolbar==5.2.0",
    "coverage==7.9.1",
    "pyright",
    "ruff",
    "pre-commit",
    "djlint",
]

[tool.uv]
# Application (pas un paquet distribuable) : ne pas tenter de builder la racine.
package = false
# Pins de sécurité Snyk : dépendances transitives non requises directement,
# épinglées pour éviter des vulnérabilités connues. Exprimées en contraintes :
# elles ne s'appliquent que lorsque la dépendance est tirée transitivement.
constraint-dependencies = [
    "zipp>=3.21.0",      # pin sécurité Snyk
    "sqlparse>=0.5.4",   # pin sécurité Snyk
    "dnspython>=2.6.1",  # pin sécurité Snyk
    "urllib3>=2.2.2",    # pin sécurité Snyk
]

# Dépendances git forkées (remplacent les lignes `git+https://…#egg=…` de requirements/base.txt).
[tool.uv.sources]
django-admin-sortable = { git = "https://github.com/LEAGUEDORA/django-admin-sortable.git" }
soundcloud = { git = "https://github.com/Benbb96/soundcloud-python.git" }
