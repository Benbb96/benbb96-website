[project]
name = "benbb96-website"
version = "1.0.0"
description = "Site web personnel de Benbb96 (Django)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django==5.2.16",
    "django-admin-sortable",  # fork LEAGUEDORA — voir [tool.uv.sources]
    "django-anymail==13.0",
    "django-autoslug==1.9.9",
    "django-colorfield==0.14.0",
    "django-cors-headers==4.9.0",
    "django-filter==25.1",
    "django-fontawesome-6==1.0.0.0",
    "django-geoposition-2==0.4.0",
    "django-pandas==0.6.7",
    "django-simple-history==3.13.0",
    "djangorestframework==3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "google-api-python-client==2.198.0",
    "pandas==3.0.5",
    "Pillow==12.3.0",
    "django-storages[google]==1.14.6",
    "python-slugify==8.0.4",
    "redis==8.1.0",  # requis par spotipy (cache_handler importe redis au chargement du module)
    "requests==2.34.2",
    "setuptools==84.0.0",
    "soundcloud",  # fork Benbb96 — voir [tool.uv.sources]
    "spotipy==2.26.0",
    "whitenoise[brotli]>=6.12.0",
]

# Dépendances de développement (PEP 735). Exclues en prod via `uv sync --no-dev`.
[dependency-groups]
dev = [
    "django-debug-toolbar==7.1.0",
    "coverage==7.15.4",
    "pyright",
    "ruff",
    "pre-commit",
    "djlint",
]

[tool.uv]
# Application (pas un paquet distribuable) : ne pas tenter de builder la racine.
package = false
# Pins de sécurité Snyk : dépendances transitives non requises directement,
# épinglées pour éviter des vulnérabilités connues. Exprimées en contraintes :
# elles ne s'appliquent que lorsque la dépendance est tirée transitivement.
constraint-dependencies = [
    "zipp>=3.21.0",      # pin sécurité Snyk
    "sqlparse>=0.5.4",   # pin sécurité Snyk
    "dnspython>=2.6.1",  # pin sécurité Snyk
    "urllib3>=2.2.2",    # pin sécurité Snyk
]

# Dépendances git forkées (remplacent les lignes `git+https://…#egg=…` de requirements/base.txt).
[tool.uv.sources]
django-admin-sortable = { git = "https://github.com/LEAGUEDORA/django-admin-sortable.git" }
soundcloud = { git = "https://github.com/Benbb96/soundcloud-python.git" }

[tool.ruff]
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E,F = pycodestyle/pyflakes ; I = isort ; UP = pyupgrade ; B = bugbear ; DJ = flake8-django.
# S (bandit/sécurité) à ajouter plus tard si peu de bruit.
select = ["E", "F", "I", "UP", "B", "DJ"]
# E501 (ligne trop longue) : géré par le formateur (qui n'ampute pas chaînes/URLs/commentaires) ;
# l'imposer au lint ne produirait que du bruit sur des chaînes non coupables.
#
# DJ001/006/007/008/012 : findings de design Django existants (null=True sur CharField →
# migration ; __all__/exclude dans des ModelForm ; modèles sans __str__ ; ordre du corps de
# modèle). Ce sont de vraies améliorations mais qui touchent modèles/formulaires (revue dédiée,
# hors passe outillage). Ignorés pour l'instant, à réactiver règle par règle après revue dédiée.
# Les autres règles DJ restent actives.
ignore = ["E501", "DJ001", "DJ006", "DJ007", "DJ008", "DJ012"]

[tool.ruff.lint.per-file-ignores]
# settings : imports * (re-export) et F403/F405 tolérés dans les settings éclatés.
"config/settings/*" = ["F403", "F405"]

[tool.djlint]
profile = "django"
# ⚠️ CONFIGURATION SEULEMENT — ne PAS lancer `djlint --reformat` : une passe design a
# retravaillé les templates, un reformatage global entrerait en conflit avec
# d'éventuelles retouches restantes. Usage prévu : `uv run djlint . --lint` (rapport).
#
# Règles ignorées car en conflit avec les conventions établies du projet (les
# imposer ne ferait que du bruit / voudrait dire tout reformater) :
#   T002 = guillemets doubles dans les tags (le projet utilise des guillemets simples)
#   T003 = {% endblock %} nommés (le projet utilise des endblock nus)
# Restent signalés : H021 (styles inline), H006 (img sans width/height → CLS/LCP),
# H023/H030/H031/H020/T001… à traiter avec la passe design.
ignore = "T002,T003"
