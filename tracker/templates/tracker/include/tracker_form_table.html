<form method="post">
    {% csrf_token %}
    <div class="ds-table-wrap">
        <table class="ds-table ds-table--striped ds-table--bordered">
            {{ form.as_table }}
        </table>
    </div>
    <div class="ds-cluster ds-cluster--center">
        <button type="submit" class="ds-btn">Valider</button>
        {% if object %}
            <a class="ds-btn ds-btn--ghost" href="{{ object.get_absolute_url }}">Annuler</a>
        {% endif %}
    </div>
</form>
